<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QLab · A股多因子量化交易系统</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">Q</span>
    <div>
      <h1>QLab 量化交易系统</h1>
      <p class="sub" id="dataset">数据加载中…</p>
    </div>
  </div>
  <div class="status" id="status">就绪</div>
</header>

<main>
  <section class="panel controls">
    <h2>回测参数 <small>（后端实时重算，非静态展示）</small></h2>
    <form id="form" class="grid">
      <label>起始日期<input name="start" value="2019-01-01" /></label>
      <label>样本内结束<input name="is_end" value="2022-12-31" /></label>
      <label>持仓只数<input name="top_n" type="number" value="30" min="5" max="100" /></label>
      <label>入选因子数<input name="factor_k" type="number" value="5" min="2" max="12" /></label>
      <label>因子加权
        <select name="weighting">
          <option value="icir">ICIR 加权</option>
          <option value="equal">等权</option>
        </select>
      </label>
      <label class="check"><input name="timing" type="checkbox" checked /> 沪深300 均线择时</label>
      <label>初始资金<input name="capital" type="number" value="10000000" step="1000000" /></label>
      <button type="submit" id="run">运行回测</button>
    </form>
  </section>

  <section class="cards" id="cards"></section>

  <section class="panel">
    <h2>归一化净值（初始 = 1.0）</h2>
    <canvas id="navChart" height="360"></canvas>
    <div class="legend"><span class="k strat"></span>策略净值
      <span class="k bench"></span>基准（沪深300）</div>
  </section>

  <section class="panel">
    <h2>月度收益热力图（%）</h2>
    <div id="heatmap" class="heatmap"></div>
  </section>

  <div class="two-col">
    <section class="panel">
      <h2>因子 IC / ICIR（样本内）</h2>
      <table class="tbl" id="factorTable">
        <thead><tr><th>因子</th><th>IC</th><th>ICIR</th><th>t</th><th>权重</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section class="panel">
      <h2>最新目标持仓</h2>
      <table class="tbl" id="holdTable">
        <thead><tr><th>代码</th><th>名称</th><th>权重</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <section class="panel">
    <h2>最近成交</h2>
    <table class="tbl" id="tradeTable">
      <thead><tr><th>日期</th><th>代码</th><th>名称</th><th>方向</th><th>股数</th><th>价格</th><th>金额</th><th>费用</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<footer>QLab v1.0 · 数据源：腾讯行情（后复权，锚定最新价）+ 新浪财经（股票池） · 回测含佣金/印花税/滑点</footer>
<script src="/static/app.js"></script>
</body>
</html>
